name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run verify gate
        run: make verify
      - name: Check changed-file whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [ "${base:-}" = "0000000000000000000000000000000000000000" ] || [ -z "${base:-}" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base..$HEAD_SHA"

  precise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-precise.txt
      - name: Install pinned precision dependencies
        run: python -m pip install --requirement requirements-precise.txt
      - name: Install Hunspell and German dictionary
        run: sudo apt-get update && sudo apt-get install --yes hunspell hunspell-de-de
      - name: Require precision dependencies
        run: |
          command -v hunspell
          python -c "import sys; sys.path.insert(0, 'scripts'); import spell_lint; assert spell_lint.availability_reason() is None, spell_lint.availability_reason()"
          python -c "import spacy; spacy.load('de_core_news_sm')"
      - name: Run precise CLI smoke
        run: |
          printf 'Der Text bleibt sachlich.\n' > /tmp/humanizer-precise-smoke.md
          python scripts/humanizer_audit.py \
            --file /tmp/humanizer-precise-smoke.md \
            --mode sachlich --precise --format json --no-profile > /tmp/humanizer-precise-smoke.json
          python -c "import json; report=json.load(open('/tmp/humanizer-precise-smoke.json')); assert report['summary']['precise']['active'] is True, report['summary']['precise']"
      - name: Run verify gate with precision path active
        run: make verify

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run verify gate through Bash
        shell: bash
        env:
          PYTHON: python
        run: make verify
