name: Erfahrung oder Feedback
description: Nutzungserfahrung, Idee oder offene Frage mit dem Projekt teilen
title: "[Feedback]: "
labels:
  - question
body:
  - type: dropdown
    id: topic
    attributes:
      label: Thema
      options:
        - Nutzungserfahrung
        - Verbesserungsidee
        - Offene Frage
        - Anderes Feedback
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Was hat funktioniert, was war unklar oder was sollte sich ändern?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Der Beitrag enthält keine vertraulichen oder personenbezogenen Angaben.
          required: true
